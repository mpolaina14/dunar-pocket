name: CI

# Cuándo se ejecuta: en cada pull request hacia main y en cada push a main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Permisos mínimos: el workflow solo necesita leer el código.
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Sin versión: toma la de "packageManager" en package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Tipos
        run: pnpm typecheck

      - name: Tests unitarios
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Descarga Chromium y las librerías del sistema que necesita.
      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Playwright compila y arranca el servidor (ver playwright.config.ts).
      - name: Tests E2E
        run: pnpm test:e2e

      # Si falla, guarda el informe para poder descargarlo desde la PR.
      - name: Subir informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
